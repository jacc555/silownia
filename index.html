const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>Math.round(n).toLocaleString('pl-PL'),N=()=>S.plan.length;
const valid=e=>e&&(e.fin||Object.values(e.ex).some(x=>x.sets.some(s=>s.ok)));
const vkeys=()=>Object.keys(S.log).filter(k=>valid(S.log[k])).sort();

S.cur=N()?S.cur%N():0;vd=S.cur;

q=needQ()?(valid(S.log[yd()])?3:1):0;

const lastW=n=>{const k=Object.keys(S.log).sort().reverse();for(const d of k){const x=S.log[d].ex[n];if(x){const o=x.sets.filter(s=>s.ok&&+s.w>0);if(o.length)return o[o.length-1].w}}return''};
const lastS=n=>{const k=Object.keys(S.log).sort().reverse();for(const d of k){const x=S.log[d].ex[n];if(x&&x.sets.some(t=>+t.w>0))return x.sets}return null};
const def=x=>{const L=lastS(x.n);return Array.from({length:x.s},(_,i)=>{const p=L&&(L[i]||L[L.length-1]);return{w:p?p.w:'',r:p&&p.r?p.r:x.r,ok:0}})};
const full=d=>{const ex={};S.plan[d].e.forEach(x=>{if(x.g==='Cardio')return;ex[x.n]={g:x.g,sets:Array.from({length:x.s},()=>({w:0,r:x.r,ok:1}))}});return{d,fin:1,ex}};
const ent=()=>{const t=today(),e=S.log[t]||(S.log[t]={d:vd,fin:0,ex:{}});if(!e.st&&!e.fin)e.st=Date.now();return e};const strt=()=>{ent();save();render()};
function mat(i){const e=ent(),x=exs(e)[i];if(!e.ex[x.n])e.ex[x.n]={g:x.g,sets:def(x)};return e.ex[x.n].sets}
const sv=(i,j,f,v)=>{mat(i)[j][f]=v;save();rclk()};const rclk=()=>{const el=document.getElementById('clk');if(el)el.innerHTML=clkCard(S.log[today()])};
const adj=(i,j,d)=>{const s=mat(i)[j];s.w=Math.max(0,Math.round(((parseFloat(s.w)||0)+d)*10)/10);save();render()};
const adjr=(i,j,d)=>{const s=mat(i)[j];s.r=Math.max(0,(parseInt(s.r)||0)+d);save();render()};
const ck=(i,j)=>{const s=mat(i)[j];s.ok=s.ok?0:1;if(s.ok){const e=ent();if(!e.st&&!e.fin)e.st=Date.now();afill(i,j)}save();render();if(s.ok){tick(i,[j],14);restStart()}};
const ns=(i,d)=>{const a=mat(i);if(d>0)a.push({...a[a.length-1],ok:0});else if(a.length>1)a.pop();save();render()};
const fin=()=>{const e=ent(),first=!e.fin;if(first){e.fin=1;e.en=Date.now();S.cur=(e.d+1)%N()}save();render();if(first){try{restStop()}catch(x){}finFx(e)}};
const undo=()=>{const t=today(),e=S.log[t];if(e&&e.fin)S.cur=e.d;delete S.log[t];vd=S.cur;save();render()};
const q1=y=>{if(y){S.log[yd()]=full(S.cur);q=2}else{S.asked=today();q=0}save();render()};
const q2=y=>{if(y){S.cur=(S.cur+1)%N();vd=S.cur}S.asked=today();q=0;save();render()};
const q3=y=>{if(y){S.cur=(S.log[yd()].d+1)%N();vd=S.cur;S.asked=today();q=0;save()}else q=4;render()};const q4=i=>{S.cur=i;vd=i;S.asked=today();q=0;save();render()};
const mk=(k,d)=>{const l=vkeys().pop()||'';S.log[k]=full(d);if(k>=l)S.cur=(d+1)%N();save();render()};

 if(q==2)h+=`<div class=card style="border-color:var(--ac)"><div class=mu>✓ Wczorajszy trening zapisany w kalendarzu</div><b>Czy przejść do kolejnego treningu (Trening ${(S.cur+1)%N()+1})?</b><div class=row style="margin-top:10px"><button class=pri onclick="q2(1)">Tak</button><button onclick="q2(0)">Nie</button></div></div>`;
 if(q==3){const L=S.log[yd()],nx=(L.d+1)%N();h+=`<div class=card style="border-color:var(--ac)"><div class=mu>Poprzednio: Trening ${L.d+1} – ${esc(S.plan[L.d]?S.plan[L.d].n:'')} ✓</div><b>Czy wykonujemy Trening ${nx+1} – ${esc(S.plan[nx].n)}?</b><div class=row style="margin-top:10px"><button class=pri onclick="q3(1)">Tak</button><button onclick="q3(0)">Nie</button></div></div>`}
 if(q==4)h+=`<div class=card style="border-color:var(--ac)"><b>Który trening dziś robisz?</b><div class=row style="margin-top:10px">${S.plan.map((p,i)=>`<button class=chip style="background:${dc(i)};color:#fff" onclick="q4(${i})">T${i+1}</button>`).join('')}</div></div>`;
 let tot=0,dn=0;exs(e).forEach(x=>{if(x.g==='Cardio')return;const a=e&&e.ex[x.n]?e.ex[x.n].sets:def(x);tot+=a.length;dn+=a.filter(s=>s.ok).length});
 h+=`<div class=card><div class=mu>${new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div><div class=h1 style="color:${dc(vd)}">Trening ${vd+1}</div><div style="font-size:17px;font-weight:600;color:var(--mu);margin-top:2px">${esc(P.n)}</div>${planList(P)}`;
 if(!e&&!chg)h+=`<div style="margin-top:8px"><button onclick="chg=1;render()">Zmień trening</button></div>`;
 if(!e&&chg)h+=`<div class=tg>${S.plan.map((p,i)=>`<button class="tt ${i==vd?'on':''}" onclick="vd=${i};chg=0;render()"><span>Trening ${i+1}</span>${i==S.cur?'<i class=dot></i>':''}<small>${esc(p.n)}</small></button>`).join('')}</div>`;
 h+=`<div class=bar><div id=pbar data-to="${tot?dn/tot*100:0}" style="width:${lastPct}%"></div></div><div class=mu>${dn}/${tot} serii</div>${tot&&dn===tot?sumCard(e,lastPct<100):''}</div>`;
 h+=`<div id=clk>${clkCard(e)}</div>`+wuCard(e);
 exs(e).forEach((x,i)=>{if(x.g==='Cardio'){h+=cpCard(x,i,P);return}const ss=e&&e.ex[x.n]?e.ex[x.n].sets:def(x),al=ss.every(s=>s.ok),fs=x.n.length>38?13:x.n.length>28?14.5:16;
  h+=`<div class=card id=ex${i} style="border-left:4px solid ${gc(x.g)}"><div class=eh><div class=en><div class=eg style="color:${gc(x.g)}">${esc(x.g)}</div><b style="font-size:${fs}px">${esc(x.n)}</b></div><button class=ib title="Jak wykonać" onclick="info(rg(${JSON.stringify(x.n).replace(/"/g,'&quot;')}))">i</button>${i>=P.e.length?`<button class="ib x" title="Usuń ćwiczenie" onclick="rx(${i})">✕</button>`:''}</div>${planRow(x,e)}<div class=sw><button class="vb ${al?'on':''}" onclick="alx(${i})"><span class=vbt><span class=ck2>✓</span>wszystkie</span></button><div class=sl>`;
  ss.forEach((s,j)=>h+=`<div class="set ${s.ok?'ok':''}"><b>${j+1}</b><div class=kgw><button class=pm title="Odejmij 2,5 kg" onclick="adj(${i},${j},-2.5)">−</button><label class=f><input type=number inputmode=decimal step=.5 placeholder=0 value="${s.w||''}" oninput="sv(${i},${j},'w',this.value);fitIn(this)"><i>kg</i></label><button class=pm title="Dodaj 2,5 kg" onclick="adj(${i},${j},2.5)">+</button></div><div class=rpw><button class=pm title="Odejmij 1" onclick="adjr(${i},${j},-1)">−</button><label class=f><input type=number inputmode=numeric placeholder=0 value="${s.r}" oninput="sv(${i},${j},'r',this.value);fitIn(this)"><i>powt.</i></label><button class=pm title="Dodaj 1" onclick="adjr(${i},${j},1)">+</button></div><button class=ck onclick="ck(${i},${j})">✓</button></div>`);
  h+='</div></div></div>'});
 h+=addCard();h+=cardioToday();h+=`<button class="pri big" onclick="finGo(this)">${e&&e.fin?'Trening zakończony ✓':'Zakończ trening'}</button>`;
 if(e)h+=`<div style="text-align:center;margin-top:10px"><button onclick="undo()">Usuń dzisiejszy trening</button></div>`;
 return h}

 const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();let cnt=0,cdy=0,c='';
 for(let i=0;i<off;i++)c+='<span></span>';

function agg(from){const r={t:0,s:0,rep:0,vol:0,g:{}};
 for(const[dt,e]of Object.entries(S.log)){if(dt<from||!valid(e))continue;r.t++;const gs=new Set();
  for(const x of Object.values(e.ex)){const ok=x.sets.filter(s=>s.ok);if(!ok.length)continue;gs.add(x.g);const G=r.g[x.g]||(r.g[x.g]={t:0,s:0,rep:0,vol:0});
   ok.forEach(s=>{const rp=+s.r||0,w=+s.w||0;r.s++;r.rep+=rp;r.vol+=rp*w;G.s++;G.rep+=rp;G.vol+=rp*w})}
  gs.forEach(g=>r.g[g].t++)}
 return r}
function bars(a){const mx=Math.max(1,...a);return `<svg viewBox="0 0 320 120" width="100%">${a.map((v,i)=>{const h=v/mx*80,x=i*26.5+4;return `<rect x="${x}" y="${100-h}" width="20" height="${h}" rx="4" fill="var(--ac)" opacity="${i==a.length-1?1:.6}" class=gy style="animation-delay:${i*45}ms"/><text class=fi style="animation-delay:${i*45+350}ms" x="${x+10}" y="${95-h}" text-anchor="middle" font-size="9" fill="var(--mu)">${v||''}</text>`}).join('')}<text x="4" y="116" font-size="10" fill="var(--mu)">12 tyg. temu</text><text x="316" y="116" text-anchor="end" font-size="10" fill="var(--mu)">ten tydzień</text></svg>`}
function line(p,u,msg){u=u||'kg';if(p.length<2)return '<div class=mu>'+(msg||'Za mało danych – potrzeba min. 2 sesji z ciężarem.')+'</div>';
 const mx=Math.max(...p.map(a=>a.v)),mn=Math.min(...p.map(a=>a.v)),rg=mx-mn||1,X=i=>20+i*280/(p.length-1),Y=v=>95-(v-mn)/rg*65;
 return `<svg viewBox="0 0 320 120" width="100%"><polyline class=draw pathLength="1" fill="none" stroke="var(--ac)" stroke-width="2.5" points="${p.map((a,i)=>X(i)+','+Y(a.v)).join(' ')}"/>${p.map((a,i)=>`<circle class=dc style="animation-delay:${500+i*40}ms" cx="${X(i)}" cy="${Y(a.v)}" r="3.5" fill="var(--ac)"/>`).join('')}<text x="20" y="14" font-size="11" fill="var(--tx)">maks. ${mx} ${u}</text><text x="20" y="116" font-size="10" fill="var(--mu)">${p[0].l}</text><text x="300" y="116" text-anchor="end" font-size="10" fill="var(--mu)">${p[p.length-1].l}</text></svg>`}


const hm=t=>new Date(t).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
const hmin=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const CCOL='#0ca678';
const fmin=m=>m>=60?(Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'')):m+' min',fmc=m=>m>=60?(m/60).toFixed(1)+' h':m+' min';
const cdl=k=>(S.cardio&&S.cardio[k])||[];
const cadd=(k,n,m)=>{n=String(n||'').trim();m=Math.round(+m);if(!n||!(m>0)||m>1440)return false;S.cardio=S.cardio||{};(S.cardio[k]=S.cardio[k]||[]).push({n,m});save();return true};
const cdel=(k,i)=>{const a=cdl(k);a.splice(i,1);if(!a.length&&S.cardio)delete S.cardio[k];save();render()};
const cok=k=>{if(cadd(k,$('#cdo').value.trim()||$('#cdn').value,$('#cdm').value)){cf=0;render()}};

 else if(valid(S.log[k]))h+=`<div style="margin-top:10px"><button onclick="cf=1;render()">＋ Cardio</button></div>`;

function cAgg(from){const r={n:0,d:0,m:0,t:{},list:[]};for(const[dt,a]of Object.entries(S.cardio||{})){if(dt<from||!a.length)continue;r.d++;a.forEach(x=>{r.n++;r.m+=x.m;const T=r.t[x.n]||(r.t[x.n]={n:0,m:0});T.n++;T.m+=x.m;r.list.push({dt,n:x.n,m:x.m})})}r.list.sort((a,b)=>b.dt.localeCompare(a.dt));return r}
const tfmt=ms=>{const t=Math.max(0,Math.floor(ms/1e3)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),c=t%60;return (h?h+':'+p2(m):p2(m))+':'+p2(c)};

function infoWu(){const u=encodeURIComponent('rozgrzewka przed treningiem siłowym kulturystyka'),b='style="background:var(--ln);color:inherit;text-decoration:none;cursor:pointer"',
 h=t=>`<div style="font-weight:700;margin:12px 0 3px">${t}</div>`;
 $('#md').innerHTML=`<div><div class=row><b class=sp>Rozgrzewka</b><button onclick="$('#md').style.display='none'">✕</button></div>
<p style="margin:6px 0 0">Fachowa rozgrzewka kulturystyczna trwa ok. 10–15 minut i ma przygotować ciało do pracy, a nie zmęczyć.</p>
${h('1. Ogólna – 5–8 min')}<div>Lekkie cardio: bieżnia, rower, orbitrek lub wioślarz w spokojnym tempie (da się swobodnie mówić). Cel: ciepło w całym ciele i lekkie pocenie.</div>
${h('2. Mobilizacja dynamiczna – 3–5 min')}<div>Pod dzisiejszą partię, po 8–12 płynnych powtórzeń, bez przytrzymywania rozciągnięcia:<br>• barki i ramiona: krążenia ramion w przód i w tył, otwieranie klatki, rotacje zewnętrzne z gumą lub linką wyciągu,<br>• klatka i plecy: ściąganie łopatek, „koci grzbiet”, rotacje tułowia,<br>• nogi i pośladki: przysiady z masą ciała, wykroki, wymachy nóg, krążenia bioder i kostek.</div>
${h('3. Serie rozgrzewkowe – 2–3 serie')}<div>W pierwszym ćwiczeniu zwiększaj ciężar stopniowo: ok. 40–50% ciężaru roboczego × 10–12 powt., ok. 60–70% × 6–8, ok. 80–85% × 2–4. Przerwy 30–60 s, daleko od upadku mięśniowego. Dopiero potem serie robocze.</div>
