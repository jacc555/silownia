function finFx(e){const o=sumOf(e),rc=recCnt(e);let ov=document.getElementById('fx');if(ov)ov.remove();ov=document.createElement('div');ov.id='fx';
 const cols=['#e8590c','#ff9248','#ffd43b','#40c057','#4dabf7','#f06595'];let cf='';
 for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*190,w=6+Math.random()*7;cf+='<i style="--x:'+(Math.cos(a)*d).toFixed(0)+'px;--y:'+(Math.sin(a)*d-70).toFixed(0)+'px;--r:'+(Math.random()*720-360).toFixed(0)+'deg;width:'+w.toFixed(1)+'px;height:'+(w*(.5+Math.random())).toFixed(1)+'px;background:'+cols[i%cols.length]+';animation-delay:'+(Math.random()*.18).toFixed(2)+'s"></i>'}
 const st=[o.m?o.m+' min':'',o.n?o.n+' '+plS(o.n):'',o.n&&o.v?nf(o.v)+' kg':'',rc?'🏆 '+rc+' '+plR(rc):''].filter(Boolean).join(' · ');
 ov.innerHTML='<div class=fxc><div class=fxs><span class="fxa l">💪</span><span class=fxt>🏆</span><span class="fxa r">💪</span></div><b class=fxh>Trening zakończony!</b><div class=fxm>'+st+'</div><div class=fxcf>'+cf+'</div></div>';
 document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
 try{if(navigator.vibrate)navigator.vibrate([40,70,40,70,240])}catch(x){}
 const close=()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),350)};ov.addEventListener('click',close);setTimeout(close,4200)}
