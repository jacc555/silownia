 <div class=mu style="margin:12px 0 2px">Godziny rozpoczęcia – ${PN[per]} ${T.n?'· średnio '+hmin(T.sm/T.n):''}</div>

 </div>`;
const W=Array(12).fill(0),Wt=Array(12).fill(0);
 for(const[k,e]of Object.entries(S.log)){if(!valid(e))continue;const dd=Math.round((wk-pd(k))/864e5),a=dd<=0?0:Math.ceil(dd/7);if(a>11)continue;Wt[a]++;Object.values(e.ex).forEach(x=>W[a]+=x.sets.filter(s=>s.ok).length)}
